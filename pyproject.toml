[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Modular RAG experimentation and evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
generation = [
    "google-genai>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]
nli = [
    "transformers>=4.30",
]
demo = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
