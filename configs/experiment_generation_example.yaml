experiment:
  name: fixed256_dense_none_gemini_generation

dataset:
  adapter: beir
  params:
    dataset_dir: data/scifact
    split: test

chunking:
  strategy: fixed_tokens
  params:
    chunk_size: 256
    overlap: 32

embedding:
  strategy: sentence_transformer
  params:
    model_name: BAAI/bge-base-en-v1.5
    batch_size: 32
    device: cpu
    query_prompt: "Represent this sentence for searching relevant passages: "

indexing:
  dense:
    strategy: faiss
    params: {}

retrieval:
  strategy: dense
  top_k: 50
  params: {}

reranking:
  strategy: none
  final_k: 10
  params: {}

evaluation:
  k_values: [1, 5, 10]

output:
  directory: results

# Requires: pip install -e ".[generation]"
# Then either $env:GEMINI_API_KEY = "your-key", or copy .env.example to .env
# and fill in GEMINI_API_KEY (python-dotenv loads it automatically).
generation:
  enabled: true
  provider: gemini
  params:
    model_name: REPLACE_WITH_YOUR_GEMINI_MODEL_ID  # e.g. gemini-2.0-flash
    temperature: 0.0
    max_output_tokens: 1024
