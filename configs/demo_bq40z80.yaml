experiment:
  name: bq40z80_demo

dataset:
  adapter: bq40z80
  params:
    dataset_path: data/bq40z80-scanpilot.txt

chunking:
  strategy: recursive
  params:
    chunk_size: 256
    overlap: 32

embedding:
  strategy: sentence_transformer
  params:
    model_name: BAAI/bge-base-en-v1.5
    batch_size: 32
    device: cpu
    query_prompt: "Represent this sentence for searching relevant passages: "
  cache:
    enabled: true
    directory: .cache/embeddings
    force_recompute: false

indexing:
  dense:
    strategy: faiss
    params: {}
  sparse:
    strategy: bm25
    params: {}

retrieval:
  strategy: hybrid
  top_k: 30
  params: {}

reranking:
  strategy: cross_encoder
  final_k: 5
  params:
    model_name: cross-encoder/ms-marco-MiniLM-L6-v2
    batch_size: 32
    device: cpu

# Requires: pip install -e ".[demo,nli]"
generation:
  enabled: true
  provider: huggingface
  params:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    device: cpu
    max_new_tokens: 384
